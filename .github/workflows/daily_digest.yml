name: Daily News Digest

on:
  schedule:
    # 05:00 UTC = 07:00 CEST (estate) / 06:00 CET (inverno)
    - cron: '0 5 * * *'
  workflow_dispatch: # permette di avviare manualmente dal sito GitHub

jobs:
  digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest
        env:
          INOREADER_APP_ID: ${{ secrets.INOREADER_APP_ID }}
          INOREADER_APP_KEY: ${{ secrets.INOREADER_APP_KEY }}
          INOREADER_EMAIL: ${{ secrets.INOREADER_EMAIL }}
          INOREADER_PASSWORD: ${{ secrets.INOREADER_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python digest.py
