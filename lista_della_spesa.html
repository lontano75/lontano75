<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lista della Spesa</title>
<style>
  body { font-family: sans-serif; max-width: 500px; margin: 30px auto; padding: 0 16px; background: #f9f9f9; }
  h1 { font-size: 1.5rem; margin-bottom: 20px; }
  h2 { font-size: 1rem; margin: 20px 0 8px; color: #555; border-bottom: 1px solid #ddd; padding-bottom: 4px; }
  label { display: flex; align-items: center; gap: 10px; padding: 6px 4px; cursor: pointer; border-radius: 4px; }
  label:hover { background: #eee; }
  input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; flex-shrink: 0; }
  .done { text-decoration: line-through; color: #aaa; }
</style>
</head>
<body>
<h1>Lista della Spesa</h1>

<h2>Latticini e Derivati</h2>
<label><input type="checkbox"> Latte d'avena barista</label>
<label><input type="checkbox"> Latte parzialmente scremato</label>
<label><input type="checkbox"> Yogurt Activia fibre avena e noci</label>
<label><input type="checkbox"> Yogurt bianco da 150</label>
<label><input type="checkbox"> Ricotta light</label>

<h2>Pane, Cereali e Secchi</h2>
<label><input type="checkbox"> Cereali integrali</label>
<label><input type="checkbox"> Frollini integrali</label>
<label><input type="checkbox"> Rosette integrali da 50 gr</label>
<label><input type="checkbox"> Farro integrale</label>
<label><input type="checkbox"> Gallette di mais</label>
<label><input type="checkbox"> Biscotti integrali per diana Galbusera</label>

<h2>Carne e Affettati</h2>
<label><input type="checkbox"> Petto di pollo</label>
<label><input type="checkbox"> Spezzatino di tacchino (600 gr)</label>
<label><input type="checkbox"> Bresaola di tacchino</label>
<label><input type="checkbox"> Prosciutto crudo</label>

<h2>Pesce</h2>
<label><input type="checkbox"> Tonno</label>
<label><input type="checkbox"> Fiori di merluzzo</label>
<label><input type="checkbox"> Salmone affumicato</label>
<label><input type="checkbox"> Gamberetti surgelati</label>

<h2>Uova</h2>
<label><input type="checkbox"> 2 confezioni di uova</label>

<h2>Verdura</h2>
<label><input type="checkbox"> Insalata</label>
<label><input type="checkbox"> Bieta in busta</label>
<label><input type="checkbox"> Patate lesse</label>
<label><input type="checkbox"> Carote lesse</label>
<label><input type="checkbox"> 500 gr pomodori</label>
<label><input type="checkbox"> 4 pomodori da insalata</label>
<label><input type="checkbox"> Contorno leggero</label>

<h2>Frutta e Frutta Secca</h2>
<label><input type="checkbox"> Kiwi</label>
<label><input type="checkbox"> Banane</label>
<label><input type="checkbox"> Mele</label>
<label><input type="checkbox"> Noci sgusciate</label>

<h2>Casa</h2>
<label><input type="checkbox"> Carta igienica</label>

<script>
  document.querySelectorAll('input[type="checkbox"]').forEach(cb => {
    cb.addEventListener('change', () => {
      cb.parentElement.classList.toggle('done', cb.checked);
    });
  });
</script>
</body>
</html>
