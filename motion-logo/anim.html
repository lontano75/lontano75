<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
  #stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  #stage svg { width: 1500px; height: auto; max-height: 700px; overflow: visible; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
// Durate in secondi
const DUR = 4.0;
const DRAW_START = 0.15, DRAW_LEN = 1.1, STAGGER = 0.9;   // tracciamento dei contorni
const FILL_DELAY = 0.55, FILL_LEN = 0.6;                  // riempimento dopo il tracciato
const SHINE_START = 2.35, SHINE_LEN = 0.75;               // riflesso di luce

const ease = t => t <= 0 ? 0 : t >= 1 ? 1 : 1 - Math.pow(1 - t, 3);
const easeBack = t => { if (t <= 0) return 0; if (t >= 1) return 1; const c = 1.6; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const clamp01 = x => Math.max(0, Math.min(1, x));

let shapes = [], svg, shineRect, group;

window.setup = (svgText) => {
  const stage = document.getElementById('stage');
  stage.innerHTML = svgText;
  svg = stage.querySelector('svg');
  if (!svg.getAttribute('viewBox')) {
    const w = parseFloat(svg.getAttribute('width')) || 400, h = parseFloat(svg.getAttribute('height')) || 100;
    svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  }
  svg.removeAttribute('width'); svg.removeAttribute('height');
  const NS = 'http://www.w3.org/2000/svg';

  // Raccoglie le forme visibili e ricava il colore effettivo di ognuna
  const els = [...svg.querySelectorAll('path,polygon,rect,circle,ellipse,polyline,line,text')]
    .filter(el => !el.closest('defs,clipPath,mask'));
  // Ogni forma diventa due: un contorno che si traccia e una copia piena
  // scoperta dal basso con un ritaglio. Niente semitrasparenze, così il
  // chroma key sul fondo verde resta pulito.
  shapes = els.map((el, i) => {
    const cs = getComputedStyle(el);
    const fill = cs.fill && cs.fill !== 'none' ? cs.fill : null;
    const color = fill || cs.stroke || '#000';
    const bb = el.getBBox();
    let len = 1000; try { len = el.getTotalLength(); } catch (e) {}
    const sw = Math.max(0.6, Math.min(bb.width, bb.height) * 0.025 + 0.6);
    let fillEl = null, clipRect = null;
    if (fill) {
      fillEl = el.cloneNode(true);
      fillEl.style.stroke = 'none';
      fillEl.style.fill = fill;
      const cp = document.createElementNS(NS, 'clipPath');
      cp.setAttribute('id', 'fpFill' + i);
      cp.setAttribute('clipPathUnits', 'userSpaceOnUse');
      clipRect = document.createElementNS(NS, 'rect');
      const pad = sw * 2;
      clipRect.setAttribute('x', bb.x - pad);
      clipRect.setAttribute('width', bb.width + pad * 2);
      cp.appendChild(clipRect);
      el.parentNode.insertBefore(cp, el);
      fillEl.setAttribute('clip-path', `url(#fpFill${i})`);
      el.parentNode.insertBefore(fillEl, el);
    }
    el.style.fill = 'none';
    el.style.stroke = color;
    el.style.strokeWidth = sw;
    el.style.strokeDasharray = len;
    el.style.strokeLinejoin = 'round';
    return { el, fillEl, clipRect, bb, len, sw, pad: sw * 2 };
  });
  // Ordina da sinistra a destra: il disegno "scrive" il logo
  const xs = shapes.map(s => s.bb.x);
  const minX = Math.min(...xs), maxX = Math.max(...xs) || 1;
  shapes.forEach(s => s.order = (s.bb.x - minX) / ((maxX - minX) || 1));

  // Gruppo che contiene tutto, per scala/posizione
  group = document.createElementNS(NS, 'g');
  [...svg.childNodes].filter(n => n.nodeName !== 'defs' && n.nodeName !== 'style').forEach(n => group.appendChild(n));
  svg.appendChild(group);

  // Riflesso: banda chiara mascherata sulla forma del logo
  const vb = svg.viewBox.baseVal;
  let defs = svg.querySelector('defs') || svg.insertBefore(document.createElementNS(NS, 'defs'), svg.firstChild);
  defs.insertAdjacentHTML('beforeend', `
    <linearGradient id="fpShineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="fpShineMask" maskUnits="userSpaceOnUse" x="${vb.x - vb.width}" y="${vb.y - vb.height}" width="${vb.width * 3}" height="${vb.height * 3}"></mask>`);
  const mask = defs.querySelector('#fpShineMask');
  const silhouette = group.cloneNode(true);
  silhouette.querySelectorAll('clipPath').forEach(n => n.remove());
  silhouette.querySelectorAll('*').forEach(n => { n.removeAttribute('clip-path'); if (n.style) { n.style.fill = '#fff'; n.style.stroke = 'none'; n.style.opacity = 1; } });
  mask.appendChild(silhouette);
  const shineG = document.createElementNS(NS, 'g');
  shineG.setAttribute('mask', 'url(#fpShineMask)');
  shineRect = document.createElementNS(NS, 'rect');
  shineRect.setAttribute('y', vb.y - vb.height);
  shineRect.setAttribute('height', vb.height * 3);
  shineRect.setAttribute('width', vb.width * 0.18);
  shineRect.setAttribute('fill', 'url(#fpShineGrad)');
  shineRect.setAttribute('transform', `skewX(-20)`);
  shineG.appendChild(shineRect);
  svg.appendChild(shineG);
  window._vb = vb;
  return shapes.length;
};

window.render = (t) => {
  shapes.forEach(s => {
    const start = DRAW_START + s.order * STAGGER;
    const d = ease((t - start) / DRAW_LEN);
    s.el.style.strokeDashoffset = s.len * (1 - d);
    s.el.style.visibility = d > 0 ? 'visible' : 'hidden';
    if (!s.fillEl) return;
    // il colore sale dal basso; il contorno d'appoggio si assottiglia fino a sparire
    const f = ease((t - start - FILL_DELAY) / FILL_LEN);
    const h = (s.bb.height + s.pad * 2) * f;
    s.clipRect.setAttribute('y', s.bb.y + s.bb.height + s.pad - h);
    s.clipRect.setAttribute('height', h);
    s.el.style.strokeWidth = s.sw * (1 - f);
    if (f >= 1) s.el.style.visibility = 'hidden';
  });
  // leggera spinta in avanti con assestamento
  const lastFill = DRAW_START + STAGGER + FILL_DELAY + FILL_LEN;
  const k = easeBack(clamp01((t - 0.0) / (lastFill)));
  const scale = 0.92 + 0.08 * k;
  const vb = window._vb;
  const cx = vb.x + vb.width / 2, cy = vb.y + vb.height / 2;
  const tr = `translate(${cx} ${cy}) scale(${scale}) translate(${-cx} ${-cy})`;
  group.setAttribute('transform', tr);
  shineRect.parentNode.setAttribute('transform', tr);
  const sp = ease(clamp01((t - SHINE_START) / SHINE_LEN));
  shineRect.setAttribute('x', vb.x - vb.width * 0.4 + sp * vb.width * 1.7);
  shineRect.style.opacity = (t > SHINE_START && t < SHINE_START + SHINE_LEN) ? 1 : 0;
};
window.DUR = DUR;
</script>
</body>
</html>
